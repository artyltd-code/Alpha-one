<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Alpha One</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero">
  <div>
    <div class="brand-kicker">PERSONAL INVESTMENT OS</div>
    <h1>Alpha One</h1>
    <p id="todayText"></p>
  </div>
  <button id="refreshBtn" class="icon-btn" aria-label="更新股價">↻</button>
</header>

<main>
  <section class="headline-card">
    <div>
      <span>目前總資產</span>
      <strong id="totalValue">NT$0</strong>
    </div>
    <div class="headline-pnl">
      <span>未實現損益</span>
      <strong id="totalPnl">NT$0</strong>
      <small id="totalRoi">0.00%</small>
    </div>
  </section>

  <section class="quick-grid">
    <article><span>總成本</span><strong id="totalCost">NT$0</strong></article>
    <article><span>持股檔數</span><strong id="holdingCount">0</strong></article>
    <article><span>今日最強</span><strong id="bestStock">—</strong></article>
    <article><span>今日最弱</span><strong id="worstStock">—</strong></article>
  </section>

  <section class="visual-grid">
    <article class="visual-card">
      <div class="visual-head">
        <div><h2>資產配置</h2><p>依市值占比</p></div>
      </div>
      <div class="donut-wrap">
        <div class="donut" id="allocationDonut"><span id="donutCenter">0 檔</span></div>
        <div id="allocationLegend" class="legend"></div>
      </div>
    </article>

    <article class="visual-card">
      <div class="visual-head">
        <div><h2>損益分布</h2><p>持股獲利與虧損</p></div>
      </div>
      <div class="profit-bars">
        <div>
          <div class="bar-label"><span>獲利持股</span><strong id="profitCount">0</strong></div>
          <div class="bar-track"><span id="profitBar" class="bar-profit"></span></div>
        </div>
        <div>
          <div class="bar-label"><span>虧損持股</span><strong id="lossCount">0</strong></div>
          <div class="bar-track"><span id="lossBar" class="bar-loss"></span></div>
        </div>
      </div>
      <div id="topMover" class="top-mover"></div>
    </article>
  </section>

  <section class="section">
    <div class="section-head">
      <div>
        <h2>我的持股</h2>
        <p>依你選擇的條件排列</p>
      </div>
      <button id="addBtn" class="primary-btn">＋ 新增</button>
    </div>

    <div class="toolbar">
      <label class="search-box">
        <span>搜尋</span>
        <input id="searchInput" placeholder="股票代號或名稱">
      </label>
      <label class="sort-box">
        <span>排序</span>
        <select id="sortSelect">
          <option value="value">市值</option>
          <option value="pnl">損益</option>
          <option value="roi">報酬率</option>
          <option value="symbol">股票代號</option>
          <option value="dayChange">今日漲跌</option>
        </select>
      </label>
      <label class="favorite-toggle">
        <input id="favoriteOnly" type="checkbox">
        <span>只看收藏</span>
      </label>
    </div>

    <div id="filterBar" class="chips">
      <button class="chip active" data-category="全部">全部</button>
      <button class="chip" data-category="ETF">ETF</button>
      <button class="chip" data-category="金融">金融</button>
      <button class="chip" data-category="科技">科技</button>
      <button class="chip" data-category="傳產">傳產</button>
      <button class="chip" data-category="其他">其他</button>
    </div>

    <div id="holdingsList" class="holding-list"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <div>
        <h2>資料管理</h2>
        <p>資料儲存在目前裝置</p>
      </div>
    </div>
    <div class="action-grid">
      <button id="exportBtn" class="secondary-btn">匯出備份</button>
      <button id="importBtn" class="secondary-btn">匯入備份</button>
      <button id="sampleBtn" class="secondary-btn">載入示範</button>
      <button id="clearBtn" class="danger-btn">清空資料</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
  </section>
</main>

<dialog id="stockDialog">
  <form id="stockForm">
    <div class="dialog-head">
      <div>
        <h2 id="dialogTitle">新增持股</h2>
        <p>輸入目前庫存資料</p>
      </div>
      <button class="close-btn" type="button" id="closeDialog">✕</button>
    </div>
    <input id="stockId" type="hidden">
    <label>股票代號<input id="symbol" required placeholder="例：00919"></label>
    <label>股票名稱<input id="name" placeholder="例：群益台灣精選高息"></label>
    <label>分類
      <select id="category">
        <option>ETF</option><option>金融</option><option>科技</option><option>傳產</option><option>其他</option>
      </select>
    </label>
    <div class="two-col">
      <label>持有股數<input id="shares" type="number" min="0" step="1" required></label>
      <label>平均成本<input id="cost" type="number" min="0" step="0.01" required></label>
    </div>
    <div class="two-col">
      <label>目前價格<input id="price" type="number" min="0" step="0.01" value="0"></label>
      <label>今日漲跌幅<input id="dayChange" type="number" step="0.01" value="0"></label>
    </div>
    <label class="favorite-field">
      <input id="favorite" type="checkbox">
      <span>加入收藏</span>
    </label>
    <button type="submit" class="primary-btn full">儲存持股</button>
  </form>
</dialog>

<div id="toast" class="toast"></div>
<script src="js/app.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");</script>
</body>
</html>
