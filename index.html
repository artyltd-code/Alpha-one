<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpha One</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#020617" />
  <link rel="apple-touch-icon" href="assets/icon-192.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div><h1>Alpha One</h1><p>台股持股損益工具</p></div>
    <button id="refreshBtn" class="primary-btn">更新價格</button>
  </header>
  <main class="container">
    <section class="summary-grid">
      <article class="summary-card"><span>總成本</span><strong id="totalCost">NT$0</strong></article>
      <article class="summary-card"><span>總市值</span><strong id="totalValue" class="blue">NT$0</strong></article>
      <article class="summary-card"><span>總損益</span><strong id="totalPnl">NT$0</strong></article>
      <article class="summary-card"><span>報酬率</span><strong id="totalRoi">0.00%</strong></article>
    </section>
    <section class="panel">
      <div class="panel-title"><h2>新增持股</h2><span id="status">資料會存在這台裝置的瀏覽器</span></div>
      <form id="stockForm" class="stock-form">
        <label>股票代號<input id="symbolInput" placeholder="例：00919、2330" autocomplete="off" required /></label>
        <label>股數<input id="sharesInput" type="number" inputmode="numeric" placeholder="例：127000" required /></label>
        <label>平均成本<input id="costInput" type="number" inputmode="decimal" step="0.01" placeholder="例：21.35" required /></label>
        <label>目前價格<input id="priceInput" type="number" inputmode="decimal" step="0.01" placeholder="可先填 0" value="0" /></label>
        <button class="primary-btn" type="submit">加入</button>
      </form>
      <div class="actions">
        <button id="exportBtn" class="ghost-btn" type="button">匯出備份</button>
        <button id="importBtn" class="ghost-btn" type="button">匯入備份</button>
        <button id="clearBtn" class="danger-btn" type="button">清空</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
    </section>
    <section class="panel">
      <div class="panel-title"><h2>我的持股</h2><span id="stockCount">0 檔</span></div>
      <div id="emptyState" class="empty-state">先新增一檔股票。之後按「更新價格」就會自動抓目前價格。</div>
      <div class="table-wrap">
        <table id="portfolioTable" hidden>
          <thead><tr><th>股票</th><th>股數</th><th>成本</th><th>現價</th><th>成本金額</th><th>市值</th><th>損益</th><th>報酬率</th><th>更新時間</th><th></th></tr></thead>
          <tbody id="portfolioBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/market.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
