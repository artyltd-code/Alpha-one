<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alpha One</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#020617" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <style>
    :root {
      --bg:#020617; --card:#111827; --text:#f8fafc; --muted:#94a3b8;
      --green:#22c55e; --red:#ef4444; --blue:#38bdf8; --line:rgba(255,255,255,.1);
      --gold:#facc15;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:radial-gradient(circle at top,#1e293b,#020617 62%);color:var(--text);min-height:100vh}
    header{padding:20px 16px 10px;position:sticky;top:0;backdrop-filter:blur(14px);background:rgba(2,6,23,.76);z-index:5;border-bottom:1px solid var(--line)}
    h1{margin:0;font-size:24px}.sub{color:var(--muted);font-size:13px;margin-top:5px}
    main{padding:14px;max-width:980px;margin:0 auto}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    .label{color:var(--muted);font-size:12px}.value{font-size:22px;font-weight:800;margin-top:6px}
    .green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.gold{color:var(--gold)}
    .section-title{margin:20px 4px 10px;font-size:16px;font-weight:800}
    form{display:grid;grid-template-columns:1.1fr .9fr .9fr .9fr auto;gap:8px;align-items:end}
    input{width:100%;border:1px solid var(--line);background:rgba(15,23,42,.8);color:var(--text);padding:11px 10px;border-radius:12px;outline:none;font-size:15px}
    input::placeholder{color:#64748b}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px 3px}
    button{border:0;color:white;background:linear-gradient(135deg,#16a34a,#22c55e);padding:12px 14px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer}
    button.secondary{background:rgba(255,255,255,.09);border:1px solid var(--line);color:var(--text)}
    button.danger{background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.35);color:#fecaca;padding:8px 10px;font-size:13px}
    button:disabled{opacity:.55;cursor:not-allowed}
    table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:16px;background:rgba(15,23,42,.58);border:1px solid var(--line)}
    th,td{text-align:right;padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
    th{color:#cbd5e1;background:rgba(255,255,255,.06);font-size:12px}th:first-child,td:first-child{text-align:left}
    tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:22px;border:1px dashed var(--line);border-radius:16px;background:rgba(255,255,255,.03)}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}.hint{color:var(--muted);font-size:12px;line-height:1.6;margin-top:8px}
    #status{margin-top:10px;color:#cbd5e1;font-size:13px}
    @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:1fr 1fr}form button{grid-column:span 2}.table-wrap{overflow-x:auto}.value{font-size:19px}}
  </style>
</head>
<body>
<header>
  <h1>Alpha One 1.1</h1>
  <div class="sub">台股持股損益工具｜按一下自動抓目前價格</div>
</header>

<main>
  <section class="grid">
    <div class="card"><div class="label">總成本</div><div id="totalCost" class="value">NT$0</div></div>
    <div class="card"><div class="label">總市值</div><div id="totalValue" class="value blue">NT$0</div></div>
    <div class="card"><div class="label">總損益</div><div id="totalPnl" class="value">NT$0</div></div>
    <div class="card"><div class="label">報酬率</div><div id="totalRoi" class="value gold">0.00%</div></div>
  </section>

  <div class="section-title">新增持股</div>
  <section class="card">
    <form id="stockForm">
      <div class="field"><label>股票代號</label><input id="name" placeholder="例：00919、2330" required></div>
      <div class="field"><label>股數</label><input id="shares" type="number" inputmode="numeric" placeholder="例：127000" required></div>
      <div class="field"><label>平均成本</label><input id="cost" type="number" inputmode="decimal" step="0.01" placeholder="例：21.35" required></div>
      <div class="field"><label>目前價格</label><input id="price" type="number" inputmode="decimal" step="0.01" placeholder="可先空著" value="0"></div>
      <button type="submit">加入</button>
    </form>
    <div class="toolbar">
      <button id="updatePriceBtn" type="button">自動更新價格</button>
      <button class="secondary" id="exportBtn" type="button">匯出</button>
      <button class="secondary" id="importBtn" type="button">匯入</button>
      <button class="danger" id="clearBtn" type="button">清空</button>
      <input id="importFile" type="file" accept="application/json" style="display:none">
    </div>
    <div id="status">價格來源：TWSE 即時行情 API。上市 / 上櫃會自動嘗試。</div>
  </section>

  <div class="section-title">我的持股</div>
  <div id="empty" class="empty">目前沒有資料。先輸入一檔股票試試。</div>
  <div class="table-wrap">
    <table id="stockTable" style="display:none">
      <thead><tr><th>股票</th><th>股數</th><th>成本</th><th>現價</th><th>成本金額</th><th>市值</th><th>損益</th><th>報酬率</th><th>更新</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
let stocks=JSON.parse(localStorage.getItem("alphaOneStocks")||"[]");
function money(n){return"NT$"+Math.round(n).toLocaleString("zh-TW")}
function pct(n){return isFinite(n)?n.toFixed(2)+"%":"0.00%"}
function save(){localStorage.setItem("alphaOneStocks",JSON.stringify(stocks))}
function normCode(x){return String(x).trim().match(/\d{4,6}/)?.[0] || String(x).trim()}
function priceFromItem(item){const raw=item.z&&item.z!=="-"?item.z:item.y;const p=Number(String(raw).replace(/,/g,""));return isFinite(p)?p:null}
async function fetchPrices(){
  if(!stocks.length){$("status").textContent="沒有股票代號可以更新。";return}
  $("updatePriceBtn").disabled=true;$("status").textContent="更新中……";
  let updated=0,failed=[];
  for(const s of stocks){
    const code=normCode(s.name);const ts=Date.now();
    const urls=[
      `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_${code}.tw&json=1&delay=0&_=${ts}`,
      `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=otc_${code}.tw&json=1&delay=0&_=${ts}`
    ];
    let ok=false;
    for(const url of urls){
      try{
        const res=await fetch(url,{cache:"no-store"});
        const data=await res.json();
        const item=data.msgArray&&data.msgArray[0];
        const p=item?priceFromItem(item):null;
        if(p){s.price=p;s.market=item.ex||"";s.lastUpdate=(item.t||"")+" "+(item.d||"");updated++;ok=true;break}
      }catch(e){}
    }
    if(!ok)failed.push(code);
    await new Promise(r=>setTimeout(r,250));
  }
  save();render();
  $("status").textContent=`已更新 ${updated} 檔`+(failed.length?`；失敗：${failed.join("、")}`:"");
  $("updatePriceBtn").disabled=false;
}
function render(){
  const tbody=document.querySelector("#stockTable tbody");tbody.innerHTML="";
  let totalCost=0,totalValue=0;
  stocks.forEach((s,i)=>{
    const costAmt=s.shares*s.cost,valueAmt=s.shares*s.price,pnl=valueAmt-costAmt,roi=costAmt?pnl/costAmt*100:0;
    totalCost+=costAmt;totalValue+=valueAmt;
    const tr=document.createElement("tr");
    tr.innerHTML=`<td><strong>${s.name}</strong></td>
      <td contenteditable onblur="edit(${i},'shares',this.innerText)">${Number(s.shares).toLocaleString("zh-TW")}</td>
      <td contenteditable onblur="edit(${i},'cost',this.innerText)">${s.cost}</td>
      <td contenteditable onblur="edit(${i},'price',this.innerText)">${s.price}</td>
      <td>${money(costAmt)}</td><td>${money(valueAmt)}</td>
      <td class="${pnl>=0?'green':'red'}">${money(pnl)}</td>
      <td class="${roi>=0?'green':'red'}">${pct(roi)}</td>
      <td>${s.lastUpdate||"-"}</td>
      <td><button class="danger" onclick="removeStock(${i})">刪除</button></td>`;
    tbody.appendChild(tr);
  });
  const pnl=totalValue-totalCost,roi=totalCost?pnl/totalCost*100:0;
  $("totalCost").textContent=money(totalCost);$("totalValue").textContent=money(totalValue);
  $("totalPnl").textContent=money(pnl);$("totalPnl").className="value "+(pnl>=0?"green":"red");
  $("totalRoi").textContent=pct(roi);$("totalRoi").className="value "+(roi>=0?"green":"red");
  $("empty").style.display=stocks.length?"none":"block";$("stockTable").style.display=stocks.length?"table":"none";
}
window.edit=(i,key,value)=>{value=String(value).replace(/,/g,"").trim();stocks[i][key]=key==="name"?value:Number(value)||0;save();render()}
window.removeStock=i=>{stocks.splice(i,1);save();render()}
$("stockForm").addEventListener("submit",e=>{e.preventDefault();stocks.push({name:$("name").value.trim(),shares:Number($("shares").value),cost:Number($("cost").value),price:Number($("price").value)||0,lastUpdate:""});save();e.target.reset();$("price").value=0;render()})
$("updatePriceBtn").onclick=fetchPrices;
$("clearBtn").onclick=()=>{if(confirm("確定清空？")){stocks=[];save();render()}}
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(stocks,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="alpha-one-data.json";a.click();URL.revokeObjectURL(url)}
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{stocks=JSON.parse(r.result);save();render()}catch{alert("匯入失敗")}};r.readAsText(file)}
render();
</script>
</body>
</html>
